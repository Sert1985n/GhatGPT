name: models-all
services:
  models-all:
    image: ollama/ollama:latest
    container_name: models-all-installer
    restart: "no"
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    volumes:
      - type: bind
        source: /opt/ollama
        target: /root/.ollama
    entrypoint: ["/bin/sh","-lc"]
    command: |
      set -e
      until ollama list >/dev/null 2>&1; do echo 'Waiting Ollama on 11434...'; sleep 3; done
      install_model(){ BASE="$1"; ALIAS="$2"; echo "Installing $BASE -> $ALIAS"; ollama pull "$BASE"; printf 'FROM %s\nSYSTEM """Всегда отвечай на русском языке. Не показывай chain-of-thought, reasoning, analysis или <think>."""\nPARAMETER temperature 0.3\n' "$BASE" >/tmp/Modelfile; ollama create "$ALIAS" -f /tmp/Modelfile || true; ollama stop "$BASE" >/dev/null 2>&1 || true; ollama stop "$ALIAS" >/dev/null 2>&1 || true; }
      install_model qwen3.5:9b ru-qwen3.5:9b
      install_model qwen3.6:27b ru-qwen3.6:27b
      install_model gemma4:e4b ru-gemma4:e4b
      install_model gemma4:26b ru-gemma4:26b
      install_model nemotron-3-nano:4b ru-nemotron-3-nano:4b
      install_model lfm2:24b-a2b ru-lfm2:24b-a2b
      install_model glm-4.7-flash:latest ru-glm-4.7-flash:latest
      install_model zai-org/glm-4.6v-flash:latest ru-glm-4.6v-flash:latest
      install_model devstral:latest ru-devstral-small-2:latest
      install_model rnj-1:latest ru-rnj-1:latest
      install_model TechyShishy/ministral-3:14b-reasoning-2512-q4_K_M ru-ministral-3:14b-reasoning
      install_model richardyoung/olmocr2:7b-q8 ru-olmocr2:7b
      install_model phi4-reasoning:plus ru-phi4-reasoning:plus
      install_model gpt-oss:20b ru-gpt-oss:20b
      install_model hermes3:8b ru-hermes3:8b
      install_model mistral-large:latest ru-mistral-large:latest
      install_model nemotron-3-super:latest ru-nemotron-3-super:latest
      install_model gemma3:27b ru-photo-gemma3:27b
      install_model yarn-mistral:7b-128k ru-yarn-mistral:7b-128k
      install_model qwen3:30b ru-qwen3:30b
      install_model qwen3:32b ru-qwen3:32b
      echo DONE
x-casaos:
  architectures:
    - amd64
  main: models-all
  author: Сергей
  category: AI
  developer: Ollama
  icon: https://cdn.jsdelivr.net/gh/Sert1985n/GhatGPT@main/Apps/models-all/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/Sert1985n/GhatGPT@main/Apps/models-all/screenshot-1.png
  title:
    en_US: Install All Models
    ru_RU: Установить все модели
  tagline:
    en_US: Install all Ollama models
    ru_RU: Установка всех моделей Ollama
  description:
    en_US: One-shot installer for all configured Ollama models. Requires Ollama GPU running.
    ru_RU: Установщик всех моделей. Требует запущенный Ollama GPU.
  index: /
