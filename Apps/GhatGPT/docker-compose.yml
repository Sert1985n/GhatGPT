name: ghatgpt
services:
  ghatgpt:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ghatgpt
    restart: unless-stopped
    network_mode: bridge
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - target: 8080
        published: "3000"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ghatgpt
        target: /app/backend/data
    environment:
      WEBUI_NAME: GhatGPT
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "true"
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_us: GhatGPT WebUI
            ru_ru: Панель GhatGPT
      volumes:
        - container: /app/backend/data
          description:
            en_us: GhatGPT data
            ru_ru: Данные GhatGPT
x-casaos:
  architectures:
    - amd64
  main: ghatgpt
  author: Сергей
  category: AI
  developer: GhatGPT
  icon: https://cdn.jsdelivr.net/gh/Sert1985n/GhatGPT@main/Apps/GhatGPT/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/Sert1985n/GhatGPT@main/Apps/GhatGPT/screenshot-1.png
  title:
    en_us: GhatGPT
  tagline:
    en_us: Local ChatGPT-like panel
  description:
    en_us: Local ChatGPT-like panel connected to Ollama.
  port_map: "3000"
  index: /
