name: ghatgpt-stack
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    network_mode: bridge
    ports:
      - target: 11434
        published: "11434"
        protocol: tcp
    volumes:
      - type: bind
        source: /opt/ollama
        target: /root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    x-casaos:
      ports:
        - container: "11434"
          description:
            en_us: Ollama API
      volumes:
        - container: /root/.ollama
          description:
            en_us: Ollama models
  ghatgpt:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ghatgpt
    restart: unless-stopped
    network_mode: bridge
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - target: 8080
        published: "3000"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ghatgpt
        target: /app/backend/data
    environment:
      WEBUI_NAME: GhatGPT
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "true"
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_us: GhatGPT WebUI
      volumes:
        - container: /app/backend/data
          description:
            en_us: GhatGPT data
x-casaos:
  architectures:
    - amd64
  main: ghatgpt
  author: Сергей
  category: AI
  developer: GhatGPT
  icon: https://cdn.jsdelivr.net/gh/Sert1985n/GhatGPT@main/Apps/GhatGPT-Stack/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/Sert1985n/GhatGPT@main/Apps/GhatGPT-Stack/screenshot-1.png
  title:
    en_us: GhatGPT Stack
  tagline:
    en_us: GhatGPT and Ollama GPU
  description:
    en_us: Full local AI stack with GhatGPT panel and Ollama GPU.
  port_map: "3000"
  index: /
