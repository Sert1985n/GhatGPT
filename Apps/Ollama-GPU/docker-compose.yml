name: ollama-gpu
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    network_mode: bridge
    ports:
      - target: 11434
        published: "11434"
        protocol: tcp
    volumes:
      - type: bind
        source: /opt/ollama
        target: /root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    x-casaos:
      ports:
        - container: "11434"
          description:
            en_us: Ollama API
            ru_ru: Ollama API
      volumes:
        - container: /root/.ollama
          description:
            en_us: Ollama models
            ru_ru: Модели Ollama
x-casaos:
  architectures:
    - amd64
  main: ollama
  author: Сергей
  category: AI
  developer: Ollama
  icon: https://cdn.jsdelivr.net/gh/Sert1985n/GhatGPT@main/Apps/Ollama-GPU/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/Sert1985n/GhatGPT@main/Apps/Ollama-GPU/screenshot-1.png
  title:
    en_us: Ollama GPU
  tagline:
    en_us: Ollama with NVIDIA GPU
  description:
    en_us: Ollama server with NVIDIA GPU and persistent /opt/ollama models.
  port_map: "11434"
  index: /
