name: models-all
services:
  models-all:
    image: ollama/ollama:latest
    container_name: models-all-installer
    restart: "no"
    network_mode: bridge
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    volumes:
      - type: bind
        source: /opt/ollama
        target: /root/.ollama
    entrypoint: ["/bin/sh","-lc"]
    command: |
      set -e
      until ollama list >/dev/null 2>&1; do echo waiting-ollama; sleep 3; done
      echo install-models-from-ollama
      ollama pull qwen3:8b || true
      ollama pull gpt-oss:20b || true
      ollama pull gemma3:27b || true
      echo done
    x-casaos:
      volumes:
        - container: /root/.ollama
          description:
            en_us: Ollama models
x-casaos:
  architectures:
    - amd64
  main: models-all
  author: Сергей
  category: AI
  developer: Ollama
  icon: https://cdn.jsdelivr.net/gh/Sert1985n/GhatGPT@main/Apps/Models-All/icon.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/Sert1985n/GhatGPT@main/Apps/Models-All/screenshot-1.png
  title:
    en_us: Install All Models
  tagline:
    en_us: Install configured models
  description:
    en_us: One-shot installer for selected Ollama models. Requires Ollama running.
  index: /
