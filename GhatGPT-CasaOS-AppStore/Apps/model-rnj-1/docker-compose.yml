name: model-rnj-1
services:
  install-model-rnj-1:
    image: ollama/ollama:latest
    container_name: install-model-rnj-1
    restart: "no"
    network_mode: host
    gpus: all
    environment:
      OLLAMA_HOST: http://127.0.0.1:11434
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - /opt/ollama:/root/.ollama
    entrypoint:
      - /bin/sh
      - -lc
    command: |
      set -e
      echo "Installing model: RNJ 1"
      echo "Alias: ru-rnj-1:latest"
      i=0
      until ollama list >/dev/null 2>&1; do
        i=$((i+1))
        if [ "$i" -gt 60 ]; then echo "Ollama API not available on 127.0.0.1:11434"; exit 1; fi
        sleep 3
      done
      SELECTED=""
      for M in 'rnj-1:latest' 'essentialai/rnj-1:latest'; do
        echo "Trying: $M"
        if ollama pull "$M"; then SELECTED="$M"; break; fi
      done
      if [ -z "$SELECTED" ]; then echo "No model tag worked for RNJ 1"; exit 1; fi
      cat > /tmp/Modelfile <<'EOF'
FROM __BASE_MODEL__
SYSTEM """
Ты локальный AI-помощник пользователя Сергея.

Жёсткие правила:
1. Всегда отвечай на русском языке.
2. Не переходи на английский, даже если пользователь пишет с ошибками, транслитом или смешанно.
3. Английские слова оставляй только для команд, кода, логов, API, путей, имён файлов и технических идентификаторов.
4. Не показывай chain-of-thought, скрытое мышление, reasoning, analysis, <think>.
5. Не начинай ответ с "Okay", "I need to analyze", "Let me think", "Сначала мне нужно".
6. Отвечай сразу по делу.
7. Для серверных задач давай команды одним цельным bash-блоком.
8. Не предлагай лишние сервисы и не придумывай то, что пользователь не просил.
9. Не удаляй данные без явного разрешения пользователя.
"""
PARAMETER temperature 0.3
EOF
      sed -i "s|__BASE_MODEL__|$SELECTED|g" /tmp/Modelfile
      ollama create "ru-rnj-1:latest" -f /tmp/Modelfile
      ollama stop "$SELECTED" >/dev/null 2>&1 || true
      ollama stop "ru-rnj-1:latest" >/dev/null 2>&1 || true
      echo "DONE: ru-rnj-1:latest from $SELECTED"
      exit 0
x-casaos:
  architectures:
    - amd64
  main: install-model-rnj-1
  author: Сергей
  category: AI
  developer: Ollama
  title:
    en_US: "Model: RNJ 1"
  tagline:
    en_US: "Install ru-rnj-1:latest"
  description:
    en_US: "One-shot installer for ru-rnj-1:latest. Requires Ollama running on port 11434."
  port_map: ""
