name: models-all
services:
  install-all-models:
    image: ollama/ollama:latest
    container_name: install-all-models
    restart: "no"
    network_mode: host
    gpus: all
    environment:
      OLLAMA_HOST: http://127.0.0.1:11434
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - /opt/ollama:/root/.ollama
    entrypoint:
      - /bin/sh
      - -lc
    command: |
      set -e
      i=0
      until ollama list >/dev/null 2>&1; do
        i=$((i+1))
        if [ "$i" -gt 60 ]; then echo "Ollama API not available on 127.0.0.1:11434"; exit 1; fi
        sleep 3
      done
      install_one() {
        TITLE="$1"; ALIAS="$2"; PHOTO="$3"; shift 3
        echo "============================================================"
        echo "Installing: $TITLE -> $ALIAS"
        echo "============================================================"
        SELECTED=""
        for M in "$@"; do
          echo "Trying: $M"
          if ollama pull "$M"; then SELECTED="$M"; break; fi
        done
        if [ -z "$SELECTED" ]; then echo "FAILED: $TITLE"; return 0; fi
        if [ "$PHOTO" = "yes" ]; then
          cat > /tmp/Modelfile <<'EOF'
FROM __BASE_MODEL__
SYSTEM """
Ты локальная мультимодальная модель для анализа фото и скриншотов.

Жёсткие правила:
1. Всегда отвечай на русском языке.
2. Если пользователь загрузил изображение, анализируй именно изображение, а не проси загрузить его снова.
3. Сначала коротко опиши, что видно на изображении.
4. Потом ответь на вопрос пользователя по делу.
5. Если это скриншот интерфейса, терминала, ошибки или панели — прочитай видимый текст и объясни, что происходит.
6. Не выдумывай деталей, которых нет на изображении.
7. Не показывай chain-of-thought, скрытое мышление, reasoning, analysis или <think>.
8. Не начинай ответ с "Okay", "I need to analyze", "Let me think", "Сначала мне нужно".
9. Английские слова оставляй только для команд, кода, логов, API, путей и технических имён.
10. Для серверных задач давай команды одним цельным bash-блоком.
"""
PARAMETER temperature 0.2
EOF
        else
          cat > /tmp/Modelfile <<'EOF'
FROM __BASE_MODEL__
SYSTEM """
Ты локальный AI-помощник пользователя Сергея.

Жёсткие правила:
1. Всегда отвечай на русском языке.
2. Не переходи на английский, даже если пользователь пишет с ошибками, транслитом или смешанно.
3. Английские слова оставляй только для команд, кода, логов, API, путей, имён файлов и технических идентификаторов.
4. Не показывай chain-of-thought, скрытое мышление, reasoning, analysis, <think>.
5. Не начинай ответ с "Okay", "I need to analyze", "Let me think", "Сначала мне нужно".
6. Отвечай сразу по делу.
7. Для серверных задач давай команды одним цельным bash-блоком.
8. Не предлагай лишние сервисы и не придумывай то, что пользователь не просил.
9. Не удаляй данные без явного разрешения пользователя.
"""
PARAMETER temperature 0.3
EOF
        fi
        sed -i "s|__BASE_MODEL__|$SELECTED|g" /tmp/Modelfile
        ollama create "$ALIAS" -f /tmp/Modelfile
        ollama stop "$SELECTED" >/dev/null 2>&1 || true
        ollama stop "$ALIAS" >/dev/null 2>&1 || true
        echo "DONE: $ALIAS from $SELECTED"
      }
      install_one "Qwen3.5 9B" "ru-qwen3.5:9b" "no" "qwen3.5:9b"
      install_one "Qwen3.6 27B" "ru-qwen3.6:27b" "no" "qwen3.6:27b"
      install_one "Gemma 4 E4B" "ru-gemma4:e4b" "no" "gemma4:e4b"
      install_one "Gemma 4 26B A4B" "ru-gemma4:26b" "no" "gemma4:26b"
      install_one "Nemotron 3 Nano 4B" "ru-nemotron-3-nano:4b" "no" "nemotron-3-nano:4b" "nvidia/nemotron-3-nano-4b:latest"
      install_one "LFM2 24B A2B" "ru-lfm2:24b-a2b" "no" "lfm2:24b-a2b" "lfm2:24b"
      install_one "GLM 4.7 Flash" "ru-glm-4.7-flash:latest" "no" "glm-4.7-flash:latest" "zai-org/glm-4.7-flash:latest"
      install_one "GLM 4.6V Flash" "ru-glm-4.6v-flash:latest" "no" "zai-org/glm-4.6v-flash:latest" "haervwe/GLM-4.6V-Flash-9B:latest"
      install_one "Devstral Small 2" "ru-devstral-small-2:latest" "no" "devstral-small-2:latest" "devstral:latest"
      install_one "RNJ 1" "ru-rnj-1:latest" "no" "rnj-1:latest" "essentialai/rnj-1:latest"
      install_one "Ministral 3 14B Reasoning" "ru-ministral-3:14b-reasoning" "no" "TechyShishy/ministral-3:14b-reasoning-2512-q4_K_M" "mistralai/ministral-3-14b-reasoning:latest"
      install_one "OlmoCR 2 7B" "ru-olmocr2:7b" "no" "richardyoung/olmocr2:7b-q8" "allenai/olmocr-2-7b:latest"
      install_one "Phi 4 Reasoning Plus" "ru-phi4-reasoning:plus" "no" "phi4-reasoning:plus" "phi4:latest"
      install_one "GPT OSS 20B" "ru-gpt-oss:20b" "no" "gpt-oss:20b" "openai/gpt-oss-20b:latest"
      install_one "Hermes 3 8B" "ru-hermes3:8b" "no" "hermes3:8b" "hermes3:latest" "hermes:latest"
      install_one "Mistral Large" "ru-mistral-large:latest" "no" "mistral-large:latest"
      install_one "Nemotron 3 Super" "ru-nemotron-3-super:latest" "no" "nemotron-3-super:latest"
      install_one "Photo Gemma3 27B" "ru-photo-gemma3:27b" "yes" "gemma3:27b"
      install_one "Yarn Mistral 7B 128K" "ru-yarn-mistral:7b-128k" "no" "yarn-mistral:7b-128k" "ru-yarn-mistral:7b-128k"
      install_one "Qwen3 30B" "ru-qwen3:30b" "no" "qwen3:30b"
      install_one "Qwen3 32B" "ru-qwen3:32b" "no" "qwen3:32b"
      echo "ALL DONE"
      exit 0

x-casaos:
  architectures:
    - amd64
  main: install-all-models
  author: Сергей
  category: AI
  developer: Ollama
  title:
    en_US: Models All
  tagline:
    en_US: Install all listed Ollama models
  description:
    en_US: One-shot installer for all model apps in this repository. Requires Ollama running on port 11434.
  port_map: ""
