name: ghatgpt
services:
  ghatgpt:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ghatgpt
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WEBUI_NAME: GhatGPT
      ENABLE_SIGNUP: "true"
      WEBUI_AUTH: "true"
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_ENGINE: comfyui
      COMFYUI_BASE_URL: http://host.docker.internal:8188
    volumes:
      - /opt/open-webui-stack/open-webui-data:/app/backend/data
    ports:
      - "3000:8080"
    x-casaos:
      ports:
        - container: "8080"
          description:
            en_US: GhatGPT web panel
      volumes:
        - container: /app/backend/data
          description:
            en_US: Open WebUI data
x-casaos:
  architectures:
    - amd64
  main: ghatgpt
  author: Сергей
  category: AI
  developer: Open WebUI
  title:
    en_US: GhatGPT
  tagline:
    en_US: Local ChatGPT-like panel
  description:
    en_US: GhatGPT panel connected to Ollama at host.docker.internal:11434 and ComfyUI at host.docker.internal:8188.
  port_map: "3000"
  index: /
