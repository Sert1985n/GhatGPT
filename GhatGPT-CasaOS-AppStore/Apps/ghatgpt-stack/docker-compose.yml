name: ghatgpt-stack
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    command: serve
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - /opt/ollama:/root/.ollama
    ports:
      - "11434:11434"
  ghatgpt:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ghatgpt
    restart: unless-stopped
    depends_on:
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_NAME: GhatGPT
      ENABLE_SIGNUP: "true"
      WEBUI_AUTH: "true"
      ENABLE_IMAGE_GENERATION: "true"
      IMAGE_GENERATION_ENGINE: comfyui
      COMFYUI_BASE_URL: http://host.docker.internal:8188
    volumes:
      - /opt/open-webui-stack/open-webui-data:/app/backend/data
    ports:
      - "3000:8080"
  ghatgpt-monitor-3420:
    build:
      context: ./monitor
      dockerfile: Dockerfile
    container_name: ghatgpt-monitor-3420
    restart: unless-stopped
    pid: host
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MONITOR_PORT: "3420"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "3420:3420"
x-casaos:
  architectures:
    - amd64
  main: ghatgpt
  author: Сергей
  category: AI
  developer: Сергей
  title:
    en_US: GhatGPT Stack
  tagline:
    en_US: GhatGPT + Ollama + Monitor 3420
  description:
    en_US: Full local AI stack with GPU Ollama, GhatGPT on 3000 and Monitor on 3420.
  port_map: "3000"
  index: /
