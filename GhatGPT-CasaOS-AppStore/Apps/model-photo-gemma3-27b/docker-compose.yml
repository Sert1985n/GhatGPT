name: model-photo-gemma3-27b
services:
  install-model-photo-gemma3-27b:
    image: ollama/ollama:latest
    container_name: install-model-photo-gemma3-27b
    restart: "no"
    network_mode: host
    gpus: all
    environment:
      OLLAMA_HOST: http://127.0.0.1:11434
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - /opt/ollama:/root/.ollama
    entrypoint:
      - /bin/sh
      - -lc
    command: |
      set -e
      echo "Installing model: Photo Gemma3 27B"
      echo "Alias: ru-photo-gemma3:27b"
      i=0
      until ollama list >/dev/null 2>&1; do
        i=$((i+1))
        if [ "$i" -gt 60 ]; then echo "Ollama API not available on 127.0.0.1:11434"; exit 1; fi
        sleep 3
      done
      SELECTED=""
      for M in 'gemma3:27b'; do
        echo "Trying: $M"
        if ollama pull "$M"; then SELECTED="$M"; break; fi
      done
      if [ -z "$SELECTED" ]; then echo "No model tag worked for Photo Gemma3 27B"; exit 1; fi
      cat > /tmp/Modelfile <<'EOF'
FROM __BASE_MODEL__
SYSTEM """
Ты локальная мультимодальная модель для анализа фото и скриншотов.

Жёсткие правила:
1. Всегда отвечай на русском языке.
2. Если пользователь загрузил изображение, анализируй именно изображение, а не проси загрузить его снова.
3. Сначала коротко опиши, что видно на изображении.
4. Потом ответь на вопрос пользователя по делу.
5. Если это скриншот интерфейса, терминала, ошибки или панели — прочитай видимый текст и объясни, что происходит.
6. Не выдумывай деталей, которых нет на изображении.
7. Не показывай chain-of-thought, скрытое мышление, reasoning, analysis или <think>.
8. Не начинай ответ с "Okay", "I need to analyze", "Let me think", "Сначала мне нужно".
9. Английские слова оставляй только для команд, кода, логов, API, путей и технических имён.
10. Для серверных задач давай команды одним цельным bash-блоком.
"""
PARAMETER temperature 0.3
EOF
      sed -i "s|__BASE_MODEL__|$SELECTED|g" /tmp/Modelfile
      ollama create "ru-photo-gemma3:27b" -f /tmp/Modelfile
      ollama stop "$SELECTED" >/dev/null 2>&1 || true
      ollama stop "ru-photo-gemma3:27b" >/dev/null 2>&1 || true
      echo "DONE: ru-photo-gemma3:27b from $SELECTED"
      exit 0
x-casaos:
  architectures:
    - amd64
  main: install-model-photo-gemma3-27b
  author: Сергей
  category: AI
  developer: Ollama
  title:
    en_US: "Model: Photo Gemma3 27B"
  tagline:
    en_US: "Install ru-photo-gemma3:27b"
  description:
    en_US: "One-shot installer for ru-photo-gemma3:27b. Requires Ollama running on port 11434."
  port_map: ""
