name: ollama
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    command: serve
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - /opt/ollama:/root/.ollama
    ports:
      - "11434:11434"
    x-casaos:
      ports:
        - container: "11434"
          description:
            en_US: Ollama API
      volumes:
        - container: /root/.ollama
          description:
            en_US: Persistent Ollama models directory
x-casaos:
  architectures:
    - amd64
  main: ollama
  author: Сергей
  category: AI
  developer: Ollama
  title:
    en_US: Ollama
  tagline:
    en_US: Local model server with NVIDIA GPU
  description:
    en_US: Ollama server with GPU enabled and persistent /opt/ollama models.
  port_map: "11434"
  index: /
