name: open-webui
services:
    open-webui:
        command:
            - bash
            - start.sh
        environment:
            ANONYMIZED_TELEMETRY: "false"
            AUXILIARY_EMBEDDING_MODEL: TaylorAI/bge-micro-v2
            DO_NOT_TRACK: "true"
            DOCKER: "true"
            ENABLE_SIGNUP: "true"
            ENV: prod
            GPG_KEY: A035C8C19219BA821ECEA86B64E628F8D684696D
            HF_HOME: /app/backend/data/cache/embedding/models
            HOME: /root
            LANG: C.UTF-8
            OLLAMA_BASE_URL: http://ollama:11434
            OPENAI_API_BASE_URL: ""
            OPENAI_API_KEY: ""
            PATH: /usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            PORT: "8080"
            PYTHON_SHA256: 272179ddd9a2e41a0fc8e42e33dfbdca0b3711aa5abf372d3f2d51543d09b625
            PYTHON_VERSION: 3.11.15
            PYTHONUNBUFFERED: "1"
            RAG_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
            RAG_RERANKING_MODEL: ""
            SCARF_NO_ANALYTICS: "true"
            SENTENCE_TRANSFORMERS_HOME: /app/backend/data/cache/embedding/models
            TIKTOKEN_CACHE_DIR: /app/backend/data/cache/tiktoken
            TIKTOKEN_ENCODING_NAME: cl100k_base
            USE_AUXILIARY_EMBEDDING_MODEL_DOCKER: TaylorAI/bge-micro-v2
            USE_CUDA_DOCKER: "false"
            USE_CUDA_DOCKER_VER: cu128
            USE_EMBEDDING_MODEL_DOCKER: sentence-transformers/all-MiniLM-L6-v2
            USE_OLLAMA_DOCKER: "false"
            USE_RERANKING_MODEL_DOCKER: ""
            USE_SLIM_DOCKER: "false"
            UV_LINK_MODE: copy
            WEBUI_AUTH: "true"
            WEBUI_BUILD_VERSION: 3660bc00fd807deced3400a63bfa6db47811a3bb
            WEBUI_NAME: GhatGPT
            WEBUI_SECRET_KEY: ""
            WHISPER_MODEL: base
            WHISPER_MODEL_DIR: /app/backend/data/cache/whisper/models
        image: ghcr.io/open-webui/open-webui:main
        network_mode: open-webui-stack_default
        ports:
            - target: 8080
              published: "3000"
              protocol: tcp
        restart: unless-stopped
        volumes:
            - type: bind
              source: /opt/open-webui-stack/open-webui-data
              target: /app/backend/data
        x-casaos:
            envs:
                - container: ENABLE_SIGNUP
                  description:
                    en_us: ""
                - container: WEBUI_NAME
                  description:
                    en_us: ""
                - container: OLLAMA_BASE_URL
                  description:
                    en_us: ""
                - container: WEBUI_AUTH
